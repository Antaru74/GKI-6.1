name: Build Compat Variant

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU type'
        required: true
        default: 'KSU'
        type: choice
        options:
          - KSU
          - SKSU
          - RSKSU
          - KSUN
          - no
      include_susfs:
        description: 'Include SuSFS (if supported by KSU type)'
        required: false
        default: true
        type: boolean
      status:
        description: 'Release status'
        required: true
        default: 'RELEASE'
        type: choice
        options:
          - RELEASE
          - BETA
      run_num:
        description: 'Run number (appended to version)'
        required: false
        default: '0'
        type: string

env:
  KERNEL_REPO: https://github.com/ahmed-alnassif/android_kernel_common-6.1
  KERNEL_BRANCH: a14-6.1
  KSU_COMPAT: "true"                     # Build compat variant
  SUSFS_INCLUDED: ${{ inputs.include_susfs && 'true' || 'false' }}
  STATUS: ${{ inputs.status }}
  TODO: kernel
  RUN_NUM: ${{ inputs.run_num }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write                    # Needed to create release
      packages: write

    steps:
      - name: Checkout build script & patches
        uses: actions/checkout@v4
        with:
          path: builder                  # Clone into 'builder' folder

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libelf-dev libssl-dev ccache wget zip git python3

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set environment for build
        run: |
          echo "KSU=${{ inputs.ksu_type }}" >> $GITHUB_ENV
          # Determine if SUSFS should be included based on input and KSU type compatibility
          if [[ "${{ inputs.include_susfs }}" == "true" ]]; then
            # Only certain KSU types support SUSFS (check in script via susfs_included function)
            # We'll set a flag; the script's susfs_included() will override if not applicable
            echo "SUSFS_ENABLED=true" >> $GITHUB_ENV
          fi
          # Set working directory
          echo "WORKDIR=${{ github.workspace }}/builder" >> $GITHUB_ENV

      - name: Build kernel (compat variant)
        working-directory: builder
        run: |
          # Make sure all scripts are executable
          chmod +x build.sh functions.sh
          # Run the main build script
          ./build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (kernel zip & logs)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-compat-artifacts
          path: builder/artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release (if RELEASE status)
        if: env.STATUS == 'RELEASE'
        working-directory: builder
        run: |
          # Read release info generated by script
          source artifacts/info.txt 2>/dev/null || true
          RELEASE_NAME="$KERNEL_NAME $RELEASE"
          TAG_NAME="v${RELEASE}"

          # Create release using GitHub CLI (already authenticated)
          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes "Kernel build for compat variant (${KSU})" \
            artifacts/*.zip \
            artifacts/*.txt \
            artifacts/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ env.RELEASE }}
          KERNEL_NAME: ${{ env.KERNEL_NAME }}
