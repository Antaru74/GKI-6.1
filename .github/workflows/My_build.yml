name: Build Compat Variant

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU type'
        required: true
        default: 'KSU'
        type: choice
        options:
          - KSU
          - SKSU
          - RSKSU
          - KSUN
          - no
      include_susfs:
        description: 'Include SuSFS'
        required: false
        default: true
        type: boolean
      status:
        description: 'Release status'
        required: true
        default: 'RELEASE'
        type: choice
        options:
          - RELEASE
          - BETA
      run_num:
        description: 'Run number'
        required: false
        default: '0'
        type: string

env:
  KERNEL_REPO: https://github.com/ahmed-alnassif/android_kernel_common-6.1
  KERNEL_BRANCH: a14-6.1
  KSU_COMPAT: "true"
  SUSFS_INCLUDED: ${{ inputs.include_susfs && 'true' || 'false' }}
  STATUS: ${{ inputs.status }}
  TODO: kernel
  RUN_NUM: ${{ inputs.run_num }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout build script & patches
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libelf-dev libssl-dev ccache wget zip git python3

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Fix build.sh to avoid LLVM for host tools
        working-directory: builder
        run: |
          # Backup original
          cp build.sh build.sh.orig
          # Remove LLVM=1 and LLVM_IAS=1 from MAKE_ARGS
          sed -i '/^MAKE_ARGS=(/,/^)/ {
            s/LLVM=1//g
            s/LLVM_IAS=1//g
          }' build.sh
          # Insert explicit Clang tools for kernel after HOSTCC/HOSTCXX
          sed -i '/^MAKE_ARGS=(/a \  HOSTCC=gcc\n  HOSTCXX=g++\n  CC=clang\n  LD=ld.lld\n  AR=llvm-ar\n  NM=llvm-nm\n  STRIP=llvm-strip\n  OBJCOPY=llvm-objcopy\n  OBJDUMP=llvm-objdump\n  READELF=llvm-readelf' build.sh
          # Also ensure CROSS_COMPILE lines remain
          echo "Patched MAKE_ARGS:"
          sed -n '/^MAKE_ARGS=(/,/^)/p' build.sh

      - name: Build kernel (compat variant)
        working-directory: builder
        run: |
          chmod +x build.sh functions.sh py/kmi-check-6.x.py
          export HOSTCC=gcc HOSTCXX=g++
          ./build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-compat-artifacts
          path: builder/artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.STATUS == 'RELEASE'
        working-directory: builder
        run: |
          source artifacts/info.txt 2>/dev/null || true
          gh release create "v${RELEASE}" \
            --title "$KERNEL_NAME $RELEASE" \
            --notes "Kernel compat variant (${KSU})" \
            artifacts/*.zip artifacts/*.txt artifacts/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
